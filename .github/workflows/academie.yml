name: Arabische Academie

on:
  push:
    paths: ["academie/**", ".github/workflows/academie.yml"]
  pull_request:
    paths: ["academie/**", ".github/workflows/academie.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: academie/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unittests (inhoud, harakat-regels, logica)
        run: npm test
      - name: Productiebuild
        run: npm run build
