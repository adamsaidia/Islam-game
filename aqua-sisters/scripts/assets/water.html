<!doctype html><html><body style="margin:0"><canvas id="c"></canvas><script>
const W = +new URLSearchParams(location.search).get('w') || 2400, H = +new URLSearchParams(location.search).get('h') || 1600;
const c = document.getElementById('c'); c.width = W; c.height = H;
const gl = c.getContext('webgl', { preserveDrawingBuffer: true });
const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs = `precision highp float;uniform vec2 r;uniform float t;uniform float tone;
#define TAU 6.28318530718
#define MAX_ITER 6
float caustic(vec2 uv,float time){vec2 p=mod(uv*TAU,TAU)-250.0;vec2 i=vec2(p);float c=1.0;float inten=.005;
for(int n=0;n<MAX_ITER;n++){float tt=time*(1.0-(3.5/float(n+1)));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}
c/=float(MAX_ITER);c=1.17-pow(c,1.4);return pow(abs(c),8.0);}
void main(){vec2 uv=gl_FragCoord.xy/r;vec2 q=vec2(uv.x*r.x/r.y,uv.y)*1.15;
float a=caustic(q*0.9+vec2(0.13,0.07),t);float b=caustic(q*1.7+vec2(0.41,0.29),t*1.3+3.);
float light=clamp(a*0.75+b*0.35,0.,1.);
vec3 deep=vec3(0.035,0.20,0.205);vec3 mid=vec3(0.06,0.42,0.44);vec3 shallow=vec3(0.36,0.78,0.76);
float depth=smoothstep(0.0,1.0,uv.y*0.85+0.1*sin(uv.x*3.));
vec3 base=mix(deep,mix(mid,shallow,0.35),depth);
vec3 col=base+light*vec3(0.55,0.85,0.80)*(0.35+0.65*depth)*tone;
float vig=smoothstep(1.25,0.3,length(uv-vec2(0.5,0.6)));col*=mix(0.72,1.0,vig);
gl_FragColor=vec4(col,1.);}`;
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, 'r'), W, H); gl.uniform1f(gl.getUniformLocation(pr, 't'), 17.3);
gl.uniform1f(gl.getUniformLocation(pr, 'tone'), +(new URLSearchParams(location.search).get('tone') || 1));
gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); window.done = c.toDataURL('image/jpeg', 0.86);
</script></body></html>
